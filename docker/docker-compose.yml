version: '3.8'

services:
  # -------------------------------------------------------------
  # Sürü Beyin 1: Rover 01 Bağımsız Kontrolcüsü
  # -------------------------------------------------------------
  agent_rover_01:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_01
    environment:
      - VEHICLE_CODE=rover_01
      - UE5_HOST=host.docker.internal
    network_mode: "host"
    restart: unless-stopped

  # -------------------------------------------------------------
  # Sürü Beyin 2: Rover 02 Bağımsız Kontrolcüsü
