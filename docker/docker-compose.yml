version: '3.8'

# ==============================================================================
# PiSim Multi-Agent Docker Swarm
# Hem Windows (Docker Desktop) hem de Raspberry Pi 5 (Linux ARM64) ile tam uyumlu!
# ==============================================================================

services:
  agent_rover_01:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_01
    environment:
      - VEHICLE_CODE=rover_01
      - UE5_HOST=${UE5_HOST:-host.docker.internal}
      - ZENOH_ROUTER=${ZENOH_ROUTER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agent_rover_02:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_02
    environment:
      - VEHICLE_CODE=rover_02
      - UE5_HOST=${UE5_HOST:-host.docker.internal}
      - ZENOH_ROUTER=${ZENOH_ROUTER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agent_rover_03:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_03
    environment:
      - VEHICLE_CODE=rover_03
      - UE5_HOST=${UE5_HOST:-host.docker.internal}
      - ZENOH_ROUTER=${ZENOH_ROUTER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
