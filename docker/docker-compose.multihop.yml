version: '3.8'

# ==============================================================================
# PiSim 3 Araçlı Dağınık Çok Atlamalı (Multi-Hop) Zenoh Swarm Testi
# ------------------------------------------------------------------------------
# Topoloji:
# 1. agent_rover_01 : Wi-Fi / Host ağına doğrudan bağlı
# 2. agent_rover_02 : Hem Wi-Fi / Host ağına hem de İzole Ağa bağlı (Köprü/Router)
# 3. agent_rover_03 : YALNIZCA izole ağa bağlı (Wi-Fi veya Host'a doğrudan erişim YOK!)
#                     agent_rover_02 üzerinden Zenoh P2P köprüsüyle Unreal'a ulaşır.
# ==============================================================================

networks:
  backbone_net:
    driver: bridge

  isolated_mesh_net:
    driver: bridge
    internal: true # Dış dünyaya, Wi-Fi'a veya Host IP'sine KESİNLİKLE doğrudan erişim YOK!

services:
  # ----------------------------------------------------------------------------
  # ARAÇ 1 BEYNİ: Rover 01 (Wi-Fi / Host'a Doğrudan Bağlı)
  # ----------------------------------------------------------------------------
  agent_rover_01:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_01
    environment:
      - VEHICLE_CODE=rover_01
      - UE5_HOST=${UE5_HOST:-host.docker.internal}
      - ZENOH_ROUTER=tcp/host.docker.internal:7447
    networks:
      - backbone_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # ARAÇ 2 BEYNİ: Rover 02 (Köprü / Router Görevi Görür)
  # Hem Wi-Fi'a bağlıdır hem de izole ağdaki Rover 03 için Zenoh dinleyicisi açar.
  # ----------------------------------------------------------------------------
  agent_rover_02:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_02
    environment:
      - VEHICLE_CODE=rover_02
      - UE5_HOST=${UE5_HOST:-host.docker.internal}
      - ZENOH_ROUTER=tcp/host.docker.internal:7447
      - ZENOH_LISTEN_ENDPOINT=tcp/0.0.0.0:7447
    networks:
      - backbone_net
      - isolated_mesh_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # ARAÇ 3 BEYNİ: Rover 03 (FİZİKSEL OLARAK İZOLE EDİLMİŞ DÜĞÜM)
  # Wi-Fi veya Host'a kesinlikle doğrudan erişemez.
  # Yalnızca agent_rover_02 üzerinden Zenoh P2P atlamasıyla konuşur.
  # ----------------------------------------------------------------------------
  agent_rover_03:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_03
    environment:
      - VEHICLE_CODE=rover_03
      - ZENOH_ROUTER=tcp/agent_rover_02:7447
    networks:
      - isolated_mesh_net
    depends_on:
      - agent_rover_02
    stdin_open: true
    tty: true
    restart: unless-stopped
