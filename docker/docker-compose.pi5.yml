# ==============================================================================
# PiSim Swarm - Raspberry Pi 5 Çok Atlamalı (Multi-Hop) & İzole Ajan Yapılandırması
# ------------------------------------------------------------------------------
# Topoloji:
# 1. agent_rover_04 : Wi-Fi omurgasına bağlı
# 2. agent_rover_05 : Hem Wi-Fi'a hem de izole ağa bağlı (Ara Aktarıcı / Router)
# 3. agent_rover_06 : FİZİKSEL OLARAK İZOLE (Wi-Fi'a doğrudan erişim YOK! internal: true)
#                     Yalnızca agent_rover_05 üzerinden Zenoh atlamasıyla konuşur.
# ==============================================================================

networks:
  pi5_backbone_net:
    driver: bridge

  pi5_isolated_net:
    driver: bridge # Yalnızca Rover 05 ve 06 arasındaki iç ağ (Rover 06 omurgaya ve Windows'a doğrudan bağlı değildir)

services:
  agent_rover_04:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_04
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - pi5_backbone_net
    environment:
      - VEHICLE_CODE=rover_04
      - TARGET_VEHICLE=${TARGET_VEHICLE:-auto}
      - VEHICLE_ID=4
      - ZENOH_ROUTER=tcp://${WINDOWS_IP:-192.168.1.3}:7447
      - LOG_LEVEL=INFO

  # Ara Köprü / Yönlendirici: Hem Wi-Fi hem İzole ağ
  agent_rover_05:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_05
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - pi5_backbone_net
      - pi5_isolated_net
    environment:
      - VEHICLE_CODE=rover_05
      - TARGET_VEHICLE=${TARGET_VEHICLE:-auto}
      - VEHICLE_ID=5
      - ZENOH_ROUTER=tcp://${WINDOWS_IP:-192.168.1.3}:7447
      - ZENOH_LISTEN_ENDPOINT=tcp/0.0.0.0:7447
      - LOG_LEVEL=INFO

  # TAMAMEN İZOLE DÜĞÜM (Wi-Fi yok, sadece agent_rover_05 üzerinden izler!)
  agent_rover_06:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pisim_agent_rover_06
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - pi5_isolated_net
    depends_on:
      - agent_rover_05
    ports:
      - "8088:8088"
    environment:
      - VEHICLE_CODE=rover_06
      - TARGET_VEHICLE=${TARGET_VEHICLE:-auto}
      - VEHICLE_ID=6
      - ZENOH_ROUTER=tcp/agent_rover_05:7447
      - LOG_LEVEL=INFO
